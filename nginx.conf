# 랜딩 사이트와 게이트웨이 프록시
#
# 정적 자산은 nginx 가 서빙한다. 게이트웨이는 WebSocket 두 채널만 맡는다.
# 랜딩에는 계정 생성이 없다. 계정 생성은 Godot 클라이언트가 게임 채널로
# 직접 한다.
#
# 게이트웨이를 외부에 직접 노출하지 않는다. 연결 상한과 로그가 nginx 가
# 설정하는 `X-Forwarded-For` 를 신뢰한다.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 정적 자산 캐시. 랜딩은 파일명에 해시를 붙이지 않으므로 짧게 잡는다
    location ~* \.(css|js|png|jpg|jpeg|webp|gif|ico|svg|woff2)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # 랜딩 정적 루트. 단일 페이지이며 경로 재작성이 없다.
    # 없는 파일은 404 로 둔다. index.html 로 되돌리면 오타가 드러나지 않는다
    location / {
        try_files $uri $uri/ =404;
    }

    # 게임 채널 WebSocket (상위 TCP 4000)
    location /ws {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 어드민 채널 WebSocket (상위 TCP 4001).
    # 인증은 MUD 서버가 한다. 게이트웨이는 상태를 갖지 않는다
    location /admin {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
