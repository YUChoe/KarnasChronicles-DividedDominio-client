# 게이트웨이와 랜딩 사이트
#
# nginx 가 정적 자산을 서빙하고 게이트웨이로 프록시한다. 게이트웨이 포트는
# 밖으로 내보내지 않는다. `X-Forwarded-For` 를 신뢰해 요청 제한을 걸으므로
# 직접 접근이 가능하면 그 헤더를 위조할 수 있다.
#
# MUD 서버는 이 compose 가 관리하지 않는다. 호스트에서 TCP 4000(게임)과
# 4001(어드민)로 실행한다. 어드민 포트는 루프백에만 바인드한다.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karnas-gateway
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - WS_PORT=3000
      - TELNET_HOST=host.docker.internal
      - TELNET_PORT=4000
      - ADMIN_PORT=4001
      - MAX_CONNECTIONS=200
      # 프레임이 오가지 않은 연결을 닫는 기준 (밀리초).
      # 클라이언트가 60초마다 ping 을 보내므로 그보다 넉넉해야 한다
      - CONNECTION_TIMEOUT=300000
      # 정적 서빙은 nginx 가 맡는다. 게이트웨이는 WebSocket 만 처리한다
      - LANDING_SERVE_STATIC=0
      - LOG_LEVEL=info
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: karnas-web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/server/public:/usr/share/nginx/html:ro
    depends_on:
      - gateway
    restart: unless-stopped
